services:
  admin:
    build:
      context: .
      dockerfile: docker/backend/admin.Dockerfile
    image: lingnow-erp-admin:latest
    container_name: lingnow-erp-admin
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: prod
      ADMIN_SERVER_PORT: ${ADMIN_SERVER_PORT:-6060}
      LINGNOW_DB_URL: ${HOST_LINGNOW_DB_URL}
      LINGNOW_DB_USERNAME: ${HOST_LINGNOW_DB_USERNAME}
      LINGNOW_DB_PASSWORD: ${HOST_LINGNOW_DB_PASSWORD}
      LINGNOW_REDIS_HOST: ${HOST_LINGNOW_REDIS_HOST:-host.docker.internal}
      LINGNOW_REDIS_PORT: ${HOST_LINGNOW_REDIS_PORT}
      LINGNOW_REDIS_PASSWORD: ${HOST_LINGNOW_REDIS_PASSWORD}
      LINGNOW_ADMIN_REDIS_DATABASE: ${LINGNOW_ADMIN_REDIS_DATABASE:-1}
      LINGNOW_FILE_BASE_PATH: ${LINGNOW_FILE_BASE_PATH:-/data/lingnow/files/}
      LINGNOW_FILE_DOMAIN: ${LINGNOW_FILE_DOMAIN:-/files/}
      LINGNOW_LOG_LEVEL: ${LINGNOW_LOG_LEVEL:-INFO}
      LINGNOW_APP_LOG_LEVEL: ${LINGNOW_APP_LOG_LEVEL:-INFO}
      LINGNOW_API_DOC_ENABLED: ${LINGNOW_API_DOC_ENABLED:-false}
    volumes:
      - app_files:/data/lingnow/files
      - admin_logs:/data/lingnow/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${ADMIN_SERVER_PORT:-6060}/welcome >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/backend/app.Dockerfile
    image: lingnow-erp-app:latest
    container_name: lingnow-erp-app
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: prod
      APP_SERVER_PORT: ${APP_SERVER_PORT:-6061}
      LINGNOW_DB_URL: ${HOST_LINGNOW_DB_URL}
      LINGNOW_DB_USERNAME: ${HOST_LINGNOW_DB_USERNAME}
      LINGNOW_DB_PASSWORD: ${HOST_LINGNOW_DB_PASSWORD}
      LINGNOW_REDIS_HOST: ${HOST_LINGNOW_REDIS_HOST:-host.docker.internal}
      LINGNOW_REDIS_PORT: ${HOST_LINGNOW_REDIS_PORT}
      LINGNOW_REDIS_PASSWORD: ${HOST_LINGNOW_REDIS_PASSWORD}
      LINGNOW_APP_REDIS_DATABASE: ${LINGNOW_APP_REDIS_DATABASE:-11}
      LINGNOW_LOG_LEVEL: ${LINGNOW_LOG_LEVEL:-INFO}
      LINGNOW_APP_LOG_LEVEL: ${LINGNOW_APP_LOG_LEVEL:-INFO}
      LINGNOW_API_DOC_ENABLED: ${LINGNOW_API_DOC_ENABLED:-false}
    volumes:
      - app_files:/data/lingnow/files
      - app_logs:/data/lingnow/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${APP_SERVER_PORT:-6061}/welcome >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: lingnow-erp-web:latest
    container_name: lingnow-erp-web
    restart: unless-stopped
    depends_on:
      admin:
        condition: service_healthy
      app:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-8090}:80"
    volumes:
      - app_files:/data/lingnow/files:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep ok"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  app_files:
  admin_logs:
  app_logs:
