<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="hummingbird-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A76F" />
      <stop offset="100%" stop-color="#007867" />
    </linearGradient>
    <linearGradient id="wing-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00C988" />
        <stop offset="100%" stop-color="#00A76F" />
    </linearGradient>
  </defs>
  
  <!-- Body -->
  <path d="M220 280 C 180 320, 150 380, 180 420 C 200 450, 240 440, 260 410 C 290 360, 250 280, 250 280" fill="url(#hummingbird-gradient)" />
  
  <!-- Head & Beak -->
  <path d="M250 280 C 270 240, 310 220, 340 230 C 355 235, 365 245, 370 260" fill="url(#hummingbird-gradient)" />
  <path d="M370 245 L 450 210" stroke="url(#hummingbird-gradient)" stroke-width="8" stroke-linecap="round" />
  
  <!-- Wings (Upper) -->
  <path d="M240 290 C 220 220, 150 100, 80 120 C 50 130, 60 180, 100 200 C 150 220, 220 280, 220 280" fill="url(#wing-gradient)" opacity="0.9" />
  
  <!-- Wings (Lower) -->
  <path d="M230 300 C 180 280, 100 250, 80 290 C 70 310, 100 330, 140 330 C 180 330, 230 300, 230 300" fill="url(#wing-gradient)" opacity="0.8" />

  <!-- Eye -->
  <circle cx="345" cy="245" r="5" fill="#FFFFFF" />

</svg>