# 生产环境配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${LINGNOW_DB_URL}
    username: ${LINGNOW_DB_USERNAME}
    password: ${LINGNOW_DB_PASSWORD}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

  #  # SQL 初始化
  #  sql:
  #    init:
  #      mode: always
  #      schema-locations: classpath:db/schema.sql
  #      continue-on-error: true

  data:
    redis:
      host: ${LINGNOW_REDIS_HOST}
      port: ${LINGNOW_REDIS_PORT:6379}
      password: ${LINGNOW_REDIS_PASSWORD:}
      database: ${LINGNOW_ADMIN_REDIS_DATABASE:1}

logging:
  level:
    cc.lingnow: debug
