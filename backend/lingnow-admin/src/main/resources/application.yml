# Spring Boot 配置
spring:
  application:
    name: lingnow-erp-admin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    banner-mode: off
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# 日志配置
logging:
  level:
    root: INFO
    cc.lingnow: INFO
    # MyBatis SQL 日志（只显示 SQL，不显示结果集）
    cc.lingnow.biz.user.mapper: DEBUG

# 服务器配置
server:
  port: ${ADMIN_SERVER_PORT:6060}
  servlet:
    context-path: /

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: cc.lingnow.core.*.entity
  configuration:
    map-underscore-to-camel-case: true
    # 禁用默认的 SQL 日志，只使用 PerformanceInterceptor
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false

# Sa-Token 配置
sa-token:
  # 默认 token 名称
  token-name: token-admin
  # Admin 账号独立配置
  admin:
    token-name: token-admin
    timeout: 2592000
    active-timeout: -1
    is-concurrent: false
    is-share: false
    token-style: simple-uuid
  # token 有效期，单位秒 (30天 = 2592000)
  timeout: 2592000
  active-timeout: -1
  # 是否允许同一账号并发登录 (false=新登录挤掉旧登录)
  is-concurrent: false
  # 在多人登录同一账号时，是否共用一个token (false=每次登录都生成新token)
  is-share: false
  # token 风格（simple-uuid 更短）
  token-style: simple-uuid
  # 是否尝试从cookie中读取token
  is-read-cookie: false
  is-read-body: false
  is-log: false
  is-print: false

# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh-CN
